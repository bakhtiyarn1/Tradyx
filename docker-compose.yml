version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tradyx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradyx_db
    ports:
      - "5433:5432"
    volumes:
      - tradyx_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  tradyx_data:
