version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradyx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradyx_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradyx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
